services:
  postgres:
    image: postgres:16
    container_name: stockpilot-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: stockpilot
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
    ports:
      - "5432:5432"
    volumes:
      - stockpilot-pgdata:/var/lib/postgresql/data

volumes:
  stockpilot-pgdata: